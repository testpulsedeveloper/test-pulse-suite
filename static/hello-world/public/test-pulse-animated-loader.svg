<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <style>
    @keyframes pulseRing {
      0% { r: 18px; opacity: 0.8; }
      50% { r: 48px; opacity: 0.3; }
      100% { r: 76px; opacity: 0; }
    }
    @keyframes pulseDash {
      0% { stroke-dashoffset: 400; opacity: 0.2; }
      30% { opacity: 1; }
      80% { opacity: 1; }
      100% { stroke-dashoffset: -400; opacity: 0.2; }
    }
    @keyframes beaconGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #0C66E4); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 16px #8247E5); }
    }
    @keyframes spinnerRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .ring-1 { animation: pulseRing 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .ring-2 { animation: pulseRing 2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s infinite; }
    .wave-line {
      stroke-dasharray: 200;
      animation: pulseDash 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .center-beacon {
      transform-origin: 135px 78px;
      animation: beaconGlow 1.8s ease-in-out infinite;
    }
    .outer-track {
      transform-origin: 120px 120px;
      animation: spinnerRotate 3.6s linear infinite;
    }
  </style>
  <defs>
    <linearGradient id="loaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C66E4"/>
      <stop offset="60%" stop-color="#6554C0"/>
      <stop offset="100%" stop-color="#8247E5"/>
    </linearGradient>
  </defs>
  <!-- Circular Base Container -->
  <rect x="20" y="20" width="200" height="200" rx="44" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Rotating Outer Ring Progress Arc -->
  <circle class="outer-track" cx="120" cy="120" r="88" fill="none" stroke="url(#loaderGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="70 200"/>
  <!-- Radar Pulse Rings -->
  <circle class="ring-1" cx="135" cy="78" r="20" fill="none" stroke="url(#loaderGrad)" stroke-width="2.5"/>
  <circle class="ring-2" cx="135" cy="78" r="20" fill="none" stroke="url(#loaderGrad)" stroke-width="1.8"/>
  <!-- Static Track Line -->
  <path d="M48 120 H74 L94 100 L114 150 L135 78 L155 130 L170 120 H192" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Animated Pulse Stroke Line -->
  <path class="wave-line" d="M48 120 H74 L94 100 L114 150 L135 78 L155 130 L170 120 H192" stroke="url(#loaderGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Animated Central Apex Node Beacon -->
  <g class="center-beacon">
    <circle cx="135" cy="78" r="8" fill="#8247E5"/>
    <circle cx="135" cy="78" r="5" fill="#FFFFFF"/>
  </g>
</svg>
