<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C66E4"/>
      <stop offset="45%" stop-color="#3854DB"/>
      <stop offset="80%" stop-color="#6554C0"/>
      <stop offset="100%" stop-color="#8247E5"/>
    </linearGradient>
    <linearGradient id="pulseStrokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E9F2FF"/>
    </linearGradient>
    <filter id="forgeIconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="innerBorder" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#091E42" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Squircle Body (Atlassian Forge standard 512x512 with 112px radius) -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#appBgGrad)" filter="url(#innerBorder)"/>

  <!-- Subtle Top Highlight Stroke -->
  <rect x="26" y="26" width="460" height="460" rx="110" stroke="white" stroke-width="3" stroke-opacity="0.3" fill="none"/>

  <!-- Subtle Background Grid/Radar Lines -->
  <circle cx="256" cy="256" r="140" stroke="white" stroke-width="1.5" stroke-opacity="0.12" fill="none" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="80" stroke="white" stroke-width="1.5" stroke-opacity="0.16" fill="none"/>

  <!-- Dynamic QA Pulse Wave + Checkmark -->
  <path d="M104 256 H156 L196 216 L236 316 L286 166 L326 276 L356 256 H408" 
        stroke="url(#pulseStrokeGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#forgeIconGlow)"/>

  <!-- Node Beacon Peak (Quality verification apex) -->
  <circle cx="286" cy="166" r="16" fill="#FFFFFF"/>
  <circle cx="286" cy="166" r="30" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.45"/>
  <circle cx="286" cy="166" r="44" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2"/>
</svg>
