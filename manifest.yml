modules:
  jira:projectPage:
    - key: test-management-project-page
      resource: main
      resolver:
        function: resolver
      title: Test Pulse
  jira:globalPage:
    - key: test-management-global-page
      resource: main
      resolver:
        function: resolver
      title: Test Pulse (Global)
  scheduledTrigger:
    - key: automated-report-trigger
      function: scheduledReportHandler
      interval: hour
  function:
    - key: resolver
      handler: index.handler
    - key: scheduledReportHandler
      handler: index.scheduledReportHandler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - manage:jira-project
    - storage:app
  external:
    fetch:
      backend:
        - '*.atlassian.com'
        - '*.atlassian.net'
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/ad7be07c-6f0f-4a18-9ceb-68355c2214b3
