modules:
  jira:projectPage:
    - key: test-management-project-page
      resource: main
      resolver:
        function: resolver
      title: Test Pulse
      layout: blank
  jira:globalPage:
    - key: test-management-global-page
      resource: main
      resolver:
        function: resolver
      title: Test Pulse (Global)
      layout: blank
  scheduledTrigger:
    - key: automated-report-trigger
      function: scheduledReportHandler
      interval: hour
  webtrigger:
    - key: mobile-upload-webtrigger
      function: mobileUploadHandler
  function:
    - key: resolver
      handler: index.handler
    - key: scheduledReportHandler
      handler: index.scheduledReportHandler
    - key: mobileUploadHandler
      handler: index.mobileUploadHandler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - manage:jira-project
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 512
    architecture: arm64
  id: ari:cloud:ecosystem::app/ad7be07c-6f0f-4a18-9ceb-68355c2214b3
