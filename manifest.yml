modules:
  jira:projectPage:
    - key: test-management-project-page
      resource: main
      resolver:
        function: resolver
      title: Test Pulse
      layout: blank
  jira:globalPage:
    - key: test-management-global-page
      resource: main
      resolver:
        function: resolver
      title: Test Pulse (Global)
      layout: blank
  scheduledTrigger:
    - key: automated-report-trigger
      function: scheduledReportHandler
      interval: hour
  webtrigger:
    - key: mobile-upload-webtrigger
      function: mobileUploadHandler
  # Opción A · fase 0: Jira indexes these fields of the `testpulse-run-data` issue property,
  # so Test Runs can be searched with JQL (e.g. `tpCycleId = "10500"`) without issue links.
  jira:entityProperty:
    - key: testpulse-run-index
      entityType: issue
      propertyKey: testpulse-run-data
      values:
        - path: activeCycleId
          type: string
          searchAlias: tpCycleId
        - path: projectId
          type: string
          searchAlias: tpProjectId
        - path: status
          type: string
          searchAlias: tpStatus
        - path: executedAtIso
          type: date
          searchAlias: tpExecutedAt
        - path: executedBy.accountId
          type: user
          searchAlias: tpExecutedBy
  # Opción A · fase 0: Forge SQL database used as a rebuildable index of executions.
  sql:
    - key: main
      engine: mysql
  # Applies the Forge SQL schema migrations when the app is installed or upgraded.
  # Records automation results (Tosca / IArvis) posted as comments on Test Runs.
  trigger:
    - key: automation-comment-trigger
      function: automationComments
      events:
        - avi:jira:commented:issue
      filter:
        ignoreSelf: true
    - key: sql-migrations-trigger
      function: sqlMigrationsHandler
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
  # Background removal of cases from a cycle: keeps running even if the page is reloaded.
  consumer:
    - key: cycle-removal-consumer
      queue: cycle-removal-queue
      resolver:
        function: cycleRemovalWorker
        method: process-cycle-removal
  function:
    - key: resolver
      handler: index.handler
    - key: scheduledReportHandler
      handler: index.scheduledReportHandler
    - key: mobileUploadHandler
      handler: index.mobileUploadHandler
    - key: sqlMigrationsHandler
      handler: index.sqlMigrationsHandler
    - key: cycleRemovalWorker
      handler: index.cycleRemovalWorker
      timeoutSeconds: 300
    - key: automationComments
      handler: index.automationCommentHandler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - manage:jira-project
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 512
    architecture: arm64
  id: ari:cloud:ecosystem::app/ad7be07c-6f0f-4a18-9ceb-68355c2214b3
